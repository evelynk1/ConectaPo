<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Fotos - ConectaPo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }

        .box {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            background: #f9f9f9;
        }

        input,
        button {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        pre {
            background: #222;
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }

        .file-group {
            border: 1px dashed #aaa;
            padding: 10px;
            margin-bottom: 15px;
            background: #fff;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Sube fotos de tu trabajo 📸🛠️</h2>

        <label><strong>1. Pega tu Token (Dueño de la publicación):</strong></label>
        <input type="text" id="token" placeholder="eyJhbGciOiJIUzI1NiIsInR...">

        <label><strong>2. ID de la Publicación (UUID):</strong></label>
        <input type="text" id="pubId" placeholder="Ej: a1b2c3d4-e5f6-...">

        <div class="file-group">
            <label>Foto 1 (Principal):</label>
            <input type="file" id="foto1" accept="image/*">

            <label>Foto 2 (Opcional):</label>
            <input type="file" id="foto2" accept="image/*">

            <label>Foto 3 (Opcional):</label>
            <input type="file" id="foto3" accept="image/*">
        </div>

        <button onclick="subirFotos()">🚀 ¡Subir a Cloudinary!</button>

        <label>Consola / Resultado:</label>
        <pre id="resultado">Esperando acción...</pre>
    </div>

    <script>
        async function subirFotos() {
            const token = document.getElementById('token').value.trim();
            const pubId = document.getElementById('pubId').value.trim();
            const foto1 = document.getElementById('foto1').files[0];
            const foto2 = document.getElementById('foto2').files[0];
            const foto3 = document.getElementById('foto3').files[0];
            const resultado = document.getElementById('resultado');

            if (!token || !pubId) {
                resultado.innerText = '❌ Error: Falta el token o el ID de la publicación.';
                return;
            }

            if (!foto1 && !foto2 && !foto3) {
                resultado.innerText = '❌ Error: Debes seleccionar al menos una foto.';
                return;
            }

            // Armamos el "Form-data" dinámicamente
            const formData = new FormData();
            if (foto1) formData.append('foto1', foto1);
            if (foto2) formData.append('foto2', foto2);
            if (foto3) formData.append('foto3', foto3);

            resultado.innerText = '⏳ Subiendo fotos a la nube... Esto puede tardar unos segundos, paciencia...';

            try {
                const response = await fetch(`http://localhost:3000/api/publicaciones/${pubId}/fotos`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const textoCrudo = await response.text();

                try {
                    const data = JSON.parse(textoCrudo);
                    if (response.ok) {
                        resultado.innerText = '✅ ¡Éxito total!\n\n' + JSON.stringify(data, null, 2);
                    } else {
                        resultado.innerText = '❌ Error del servidor:\n\n' + JSON.stringify(data, null, 2);
                    }
                } catch (parseError) {
                    resultado.innerText = `❌ El servidor devolvió algo que no es JSON (Status ${response.status}):\n\n${textoCrudo}`;
                }

            } catch (error) {
                resultado.innerText = '❌ Error de red:\n\n' + error.message;
            }
        }
    </script>
</body>

</html>
